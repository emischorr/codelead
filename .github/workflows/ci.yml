name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/Elixir from .tool-versions
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Git identity for test repos
        run: |
          git config --global user.name "CodeLead CI"
          git config --global user.email "ci@localhost"

      - run: mix deps.get

      # precommit's `format` and `deps.unlock --unused` fix files instead of
      # failing — check them explicitly so CI can't pass on unformatted code.
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused

      - run: mix precommit
