services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PW}
      APP_DB_PW: ${APP_DB_PW}
    volumes:
      - pg:/var/lib/postgresql
      - ./init-app-db.sh:/docker-entrypoint-initdb.d/init-app-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/emischorr/codelead:latest
    command: ["/app/bin/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ecto://codelead:${APP_DB_PW}@db/codelead
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/emischorr/codelead:latest
    command: ["/app/bin/server"]
    environment:
      DATABASE_URL: ecto://codelead:${APP_DB_PW}@db/codelead
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PHX_HOST: localhost
      SCHEME: http
      # The port the app listens on inside the container.
      PORT: "4000"
      # The port in generated links. Set here because this stack is reached
      # directly on 4000; behind a proxy on 443, drop it and set SCHEME: https.
      URL_PORT: "4000"
      # Extra addresses this instance may be reached at, on top of PHX_HOST.
      # Bare host = any scheme/port; full origin = exact match; "*" = allow all.
      # ALLOWED_HOSTS: "192.168.1.50, codelead.local"
      # The name the *host* docker daemon knows the data volume by — sibling
      # task containers mount it by this name for container execution. Must
      # match the pinned volume name below.
      WORKSPACE_VOLUME: codelead-data
      # Signed license key. Optional — without one the instance runs the
      # community tier, which today grants everything. See docs/licensing.md.
      # LICENSE_KEY: ${LICENSE_KEY}
    volumes:
      - codelead-data:/data
      # Container task execution creates sibling containers through the host
      # docker daemon. Mounting the socket is root-equivalent on the host —
      # an accepted trade under the single-tenant model (ADR-0003/0004).
      # Remove this line, group_add below, and WORKSPACE_VOLUME above to
      # disable it. Mounting alone is not enough — see group_add.
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket is root:docker 0660 on the host while CodeLead runs as uid
    # 1000, so the app container also needs the host's docker group id:
    # `stat -c '%g' /var/run/docker.sock` on the host, into DOCKER_GID in .env.
    # Numeric only — the image has no `docker` group to resolve a name against.
    # The 0 fallback keeps the stack bootable (and is right on Docker Desktop),
    # but on a Linux host an unset DOCKER_GID means permission denied.
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pg:
  # Pinned so WORKSPACE_VOLUME above stays correct regardless of the compose project name.
  codelead-data:
    name: codelead-data