services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PW}
      APP_DB_PW: ${APP_DB_PW}
    volumes:
      - pg:/var/lib/postgresql
      - ./init-app-db.sh:/docker-entrypoint-initdb.d/init-app-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/emischorr/codelead:latest
    command: ["/app/bin/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ecto://codelead:${APP_DB_PW}@db/codelead
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/emischorr/codelead:latest
    command: ["/app/bin/server"]
    environment:
      DATABASE_URL: ecto://codelead:${APP_DB_PW}@db/codelead
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # The instance's canonical address — see "URLs" in docs/deployment.md.
      PHX_HOST: localhost
      SCHEME: http
      PORT: "4000"
      URL_PORT: "4000"
      # Extra addresses browsers may use — see "The origin check" in docs/deployment.md.
      # ALLOWED_HOSTS: "192.168.1.50, codelead.local"
      # Must live under the bind mount below — see "The data directory" in docs/deployment.md.
      WORKSPACE_ROOT: ${DATA_ROOT:?set DATA_ROOT in .env — see .env.example}/workspace
      HOME: ${DATA_ROOT}/home
      # Optional; without it the community tier runs — see docs/licensing.md.
      # LICENSE_KEY: ${LICENSE_KEY}
    volumes:
      # Host path == container path, on purpose — see "The data directory" in docs/deployment.md.
      - ${DATA_ROOT}:${DATA_ROOT}
      # Enables container task execution; root-equivalent on the host — see docs/deployment.md.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pg:
